spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:stockpilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-local-key}
      chat:
        options:
          model: gpt-4o-mini

kis:
  api:
    base-url: https://openapivts.koreainvestment.com:29443
    app-key: ${KIS_APP_KEY:mock-app-key}
    app-secret: ${KIS_APP_SECRET:mock-app-secret}
    cano: ${KIS_CANO:00000000}
    acnt-prdt-cd: ${KIS_ACNT_PRDT_CD:01}

jwt:
  secret-key: ${JWT_SECRET_KEY:stockpilot-local-secret-key-must-be-very-long-32bytes-minimum}
  access-token-expiration-seconds: 86400

logging:
  level:
    root: INFO
    com.stockpilot: DEBUG
    org.hibernate.SQL: DEBUG
